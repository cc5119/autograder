[package]
name = "autograder"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
jiff = { version = "0.2", features = ["serde"] }
csv = "1"
semver = "1"
roxmltree = "0.20"
quote = "1.0.46"
proc-macro2 = "1.0.106"
prettyplease = "0.2.37"
syn = { version = "2.0.119", features = ["full", "printing", "parsing", "clone-impls"] }
tempfile = "3"
ignore = "0.4"
include_dir = "0.7"
sha2 = "0.10"
toml_edit = "0.22"

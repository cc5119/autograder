[package]
name = "autograder"
version = "0.1.0"
edition = "2024"
# A single integration test binary (tests/integration.rs, with init/publish/cli
# as its modules) instead of Cargo's default one-binary-per-file-under-tests/.
autotests = false

[workspace]
members = ["crates/autograder-test"]

[[test]]
name = "integration"
path = "tests/integration.rs"

# Opt-in suite needing real podman + the base image; CI runs it with
# `--features container-tests`, a plain `cargo test` skips it.
[[test]]
name = "container"
path = "tests/container.rs"
required-features = ["container-tests"]

[features]
container-tests = []

[dependencies]
clap = { version = "4", features = ["derive", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "1.1.4"
jiff = { version = "0.2", features = ["serde"] }
csv = "1"
semver = "1"
roxmltree = "0.21.1"
ra_ap_syntax = "=0.0.349"
# Unused directly: caps a transitive dep of `ra_ap_syntax`, whose lexer
# refuses to compile unless `unicode-ident` and `unicode-properties` agree
# on the Unicode version. unicode-ident 1.0.25 moved to Unicode 18, while
# unicode-properties 0.1.4 (latest) is still on 17. Drop once that catches up.
unicode-ident = "<1.0.25"
cfg-expr = "=0.20.9"
tempfile = "3"
ignore = "0.4"
include_dir = "0.7"
sha2 = "0.11"
toml_edit = "0.25.13"
subprocess = "1.2.0"
indicatif = "0.18.6"
console = "0.16"
dialoguer = "0.12"
rayon = "1.12.0"
indexmap = { version = "2", features = ["serde"] }

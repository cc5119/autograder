[package]
name = "autograder"
version = "0.1.0"
edition = "2024"
# A single integration test binary (tests/integration.rs, with init/publish/cli
# as its modules) instead of Cargo's default one-binary-per-file-under-tests/.
autotests = false

[workspace]
members = ["crates/autograder-test"]

[[test]]
name = "integration"
path = "tests/integration.rs"

# Opt-in suite needing real podman + the base image; CI runs it with
# `--features container-tests`, a plain `cargo test` skips it.
[[test]]
name = "container"
path = "tests/container.rs"
required-features = ["container-tests"]

[features]
container-tests = []

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "1.1.4"
jiff = { version = "0.2", features = ["serde"] }
csv = "1"
semver = "1"
roxmltree = "0.21.1"
ra_ap_syntax = "=0.0.344"
cfg-expr = "=0.20.8"
tempfile = "3"
ignore = "0.4"
include_dir = "0.7"
sha2 = "0.11"
toml_edit = "0.25.13"
subprocess = "1.2.0"
indicatif = "0.18.6"
console = "0.16"

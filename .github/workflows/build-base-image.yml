name: Build and push autograder base image

on:
  push:
    branches: [main]
    paths:
      - container/Containerfile
      - .github/workflows/build-base-image.yml
  workflow_dispatch: {}

env:
  IMAGE_NAME: autograder-base

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Build image
        run: |
          podman build \
            --build-arg IMAGE_SOURCE="https://github.com/${{ github.repository }}" \
            -t "${IMAGE_NAME}:build" \
            -f container/Containerfile container/

      - name: Resolve rustc version
        id: rustc
        run: |
          version="$(podman run --rm "${IMAGE_NAME}:build" rustc --version | awk '{print $2}')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Tag image
        run: |
          registry="ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}"
          podman tag "${IMAGE_NAME}:build" "${registry}:latest"
          podman tag "${IMAGE_NAME}:build" "${registry}:${{ steps.rustc.outputs.version }}"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Push image
        run: |
          registry="ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}"
          podman push "${registry}:latest"
          podman push "${registry}:${{ steps.rustc.outputs.version }}"

name: release

# Cross-compiles the `autograder` binary that a published starter repo's
# `.github/workflows/autograde.yml` downloads (see `templates/autograde.yml.tmpl`).
# Runs on every push to main and republishes the single `latest` release in
# place, so there's no version number to pick or bump -- the template always
# points at the newest build.
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset_name: autograder-x86_64-linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage binary + checksum
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/autograder dist/${{ matrix.asset_name }}
          cd dist
          sha256sum ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create latest \
            --title "latest" \
            --notes "Continuously updated with the latest main." \
            --repo "${{ github.repository }}" \
            dist/${{ matrix.asset_name }} \
            dist/${{ matrix.asset_name }}.sha256 \
            || gh release upload latest \
                 dist/${{ matrix.asset_name }} \
                 dist/${{ matrix.asset_name }}.sha256 \
                 --repo "${{ github.repository }}" \
                 --clobber

name: release

# Cross-compiles the pinned `autograder` binary students' CI download step
# fetches (design §11.2, docs/plan.md step 19). Triggered by pushing a
# `v*` tag; the tag name becomes both the release name and the version
# string a starter template's `.github/workflows/autograde.yml` pins to
# (see `scaffold::RELEASE_VERSION`).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset_name: autograder-x86_64-linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage binary + checksum
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/autograder dist/${{ matrix.asset_name }}
          cd dist
          sha256sum ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --repo "${{ github.repository }}" \
            dist/${{ matrix.asset_name }} \
            dist/${{ matrix.asset_name }}.sha256 \
            || gh release upload "${{ github.ref_name }}" \
                 dist/${{ matrix.asset_name }} \
                 dist/${{ matrix.asset_name }}.sha256 \
                 --repo "${{ github.repository }}" \
                 --clobber

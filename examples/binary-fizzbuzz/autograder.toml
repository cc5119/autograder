# Private, standalone full spec for the `binary-fizzbuzz` example (a
# `binary`-kind assignment, as opposed to library-stack's `library` one).
# Self-contained: defines every test (public + hidden) and its point value;
# `autograder scaffold` derives the public/starter view straight from this
# file, no separate hand-maintained repo.
#
# `id` doubles as the student-facing binary target name (no [student]
# section): the judge (./fizzbuzz/tests/judge.rs -- no separate harness/
# crate for binary-kind, see evaluator::binary's module doc comment) spawns
# `env!("CARGO_BIN_EXE_fizzbuzz")`, and the reference solution lives in
# ./fizzbuzz/, named to match.

[assignment]
id = "fizzbuzz"
name = "FizzBuzz (binary example)"
kind = "binary"
deadline = "2099-01-01T00:00:00[UTC]"

[sandbox]
image = "autograder-base:1.86.0"

[allowed-crates]

[limits.build]
wall-clock = "60s"
cpus = 2
memory = "1GiB"
pids = 128

[limits.run]
cpu-time = "5s"
wall-clock = "10s"
cpus = 1
memory = "256MiB"
pids = 64
max-output-bytes = "64KiB"

[scoring]
model = "weighted"

[[scoring.tests]]
name = "fizzbuzz_1_to_15"
points = 10
visibility = "public"

[[scoring.tests]]
name = "fizzbuzz_multiples_of_15_and_zero"
points = 20
visibility = "private"

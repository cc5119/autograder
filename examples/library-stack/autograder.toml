# Private, standalone full spec for the `library-stack` example
# (design §5.1). Self-contained; `autograder publish` derives the
# public/starter view straight from this package, no separate
# hand-maintained repo. Which judge tests ship to students is controlled by
# `keep`/`stub`/`hide` doc-comments on the `#[test]` fns themselves (see
# ./harness/tests/judge.rs), not by anything declared here.
#
# `id` doubles as the student-facing crate name (no [student] section): the
# harness's Cargo.toml depends on `library-stack-example`, and the
# reference solution lives in ./library-stack-example/, named to
# match.

[assignment]
id = "library-stack"
name = "Stack (library example)"
kind = "library"
deadline = "2099-01-01T00:00:00[UTC]"
harness = "harness"
cargo-lock-sha256 = "5fdb98a23f0d720850c5e04771c74b926301dd51c16e1c001fc9a166654c1566"

[sandbox]
image = "ghcr.io/cc5119/autograder-base:1.97.1"

[limits.build]
wall-clock = "60s"
cpus = 2
memory = "1GiB"
pids = 128

[limits.run]
cpu-time = "5s"
wall-clock = "10s"
cpus = 1
memory = "256MiB"
pids = 64
max-output-bytes = "64KiB"

[scoring]
formula = "sum"
base = 0.0

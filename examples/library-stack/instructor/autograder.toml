# Private, standalone full spec for the `library-stack` example
# (design §5.1). Self-contained: defines every test (public + hidden) and
# its point value; `autograder scaffold` derives the public/starter view
# straight from this file, no separate hand-maintained repo.
#
# `id` doubles as the student-facing crate name (no [student] section): the
# harness's Cargo.toml depends on `library-stack-example`, and the
# reference solution lives in ./library-stack-example/, named to
# match.

[assignment]
id = "library-stack-example"
name = "Stack (library example)"
kind = "library"
deadline = "2099-01-01T00:00:00-00:00"

[toolchain]
channel = "1.86.0"

[allowed-crates]

[limits.build]
wall-clock = "60s"
cpus = 2
memory = "1GiB"
pids = 128

[limits.run]
cpu-time = "5s"
wall-clock = "10s"
cpus = 1
memory = "256MiB"
pids = 64
max-output-bytes = "64KiB"

[scoring]
model = "weighted"

[[scoring.tests]]
name = "push_pop_basic"
points = 10
visibility = "public"

[[scoring.tests]]
name = "many_pushes_then_pops"
points = 20
visibility = "private"
